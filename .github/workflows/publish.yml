name: Syndicate

# Deployment is handled by Vercel's Git integration, so this workflow only
# covers optional cross-posting. It is manual by design: syndicating is a
# decision per post, not something every push should trigger.
on:
  workflow_dispatch:
    inputs:
      ping_google:
        description: 'Also ping the Google Indexing API'
        type: boolean
        default: true

jobs:
  syndicate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      - name: Generate social drafts
        run: npx tsx scripts/generate-social.ts

      - uses: actions/upload-artifact@v4
        with:
          name: social-drafts
          path: social/
          if-no-files-found: ignore

      - name: Publish to platforms
        env:
          HASHNODE_API_KEY: ${{ secrets.HASHNODE_API_KEY }}
          HASHNODE_PUBLICATION_ID: ${{ secrets.HASHNODE_PUBLICATION_ID }}
          BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}
          BEEHIIV_PUBLICATION_ID: ${{ secrets.BEEHIIV_PUBLICATION_ID }}
        run: npx tsx scripts/publish.ts

      - name: Ping Google
        if: inputs.ping_google
        env:
          GOOGLE_INDEXING_API_KEY: ${{ secrets.GOOGLE_INDEXING_API_KEY }}
        run: npx tsx scripts/ping-google.ts
