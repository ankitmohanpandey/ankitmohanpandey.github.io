name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run on the same branch has nothing useful left to say.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run build
      - name: Check bundle budget
        run: npm run check:budget

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Fails the job on high/critical advisories only; moderate findings in
      # build-time tooling shouldn't block a content deploy.
      - run: npm audit --audit-level=high
