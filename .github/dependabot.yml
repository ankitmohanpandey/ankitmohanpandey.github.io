version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Only vetted releases: skip anything published in the last week, since a
    # meaningful share of supply-chain attacks are caught and yanked early.
    cooldown:
      default-days: 7
    groups:
      # One PR for the framework, otherwise these land as four conflicting ones.
      next:
        patterns:
          - 'next'
          - '@next/*'
          - 'eslint-config-next'
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-minor:
        dependency-type: production
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
